<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GRABBY PANDA</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#102e24"><meta name="apple-mobile-web-app-title" content="Grabby Panda"><style>*{box-sizing:border-box}body{margin:0;background:#102e24;color:white;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;touch-action:manipulation}#wrap{position:relative;width:min(100vw,440px);height:min(100dvh,780px);overflow:hidden;border:5px solid #284d36;border-radius:20px;background:linear-gradient(#8de3c3,#d7f2ae 75%,#7ab65c 75%)}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:900;color:#173c2d;text-shadow:0 1px #fff;font-size:19px}#overlay{position:absolute;inset:0;background:#103b2bc9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}h1{font-size:45px;line-height:1;margin:0;color:#fff18d;text-shadow:4px 5px #143b2c;transform:rotate(-3deg)}p{line-height:1.5}button{background:#f8d449;border:0;border-bottom:6px solid #b18a21;border-radius:18px;padding:17px 40px;font-size:24px;font-weight:1000;color:#23452e;cursor:pointer}#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#23503b;font-weight:800;pointer-events:none}#levelbar{position:absolute;top:48px;left:16px;right:16px;color:#173c2d;font-size:13px;font-weight:900;text-shadow:0 1px #fff}#track{height:10px;border-radius:20px;background:#25533e55;overflow:hidden;margin-top:5px;border:1px solid #25533e66}#fill{height:100%;width:0%;background:#39b94b;border-radius:20px;transition:width .15s}#levelFlash{position:absolute;top:23%;left:0;right:0;text-align:center;font-size:45px;font-weight:1000;color:#fff18d;text-shadow:3px 4px #174632;pointer-events:none;opacity:0;transform:scale(.7)}#levelFlash.show{animation:levelpop 1.2s ease-out forwards}@keyframes levelpop{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.2)}55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}#feedback{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:1000;pointer-events:none;text-shadow:2px 3px #173c2d}</style></head><body><div id="wrap"><canvas id="game" width="430" height="760"></canvas><div id="hud"><span id="score">🎋 0</span><span id="lives">❤️❤️❤️</span><span id="best">BEST 0</span></div><div id="levelbar"><div id="leveltext">LEVEL 1 · 0 / 10 🎋</div><div id="track"><div id="fill"></div></div></div><div id="levelFlash"></div><div id="feedback"></div><div id="hint">TAP ANYWHERE TO GRAB!</div><div id="overlay"><h1>GRABBY<br>PANDA 🐼</h1><p>Grab the 🎋 bamboo!<br>Don't grab the junk!<br>Miss bamboo or grab junk = lose a life.<br><b>Three lives. One very hungry panda.<br>Every bamboo makes him BIGGER!<br>Complete levels: 10, 20, 30 bamboo and more!</b></p><button id="start">LET'S GRAB!</button></div></div><script>const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),feedback=document.getElementById('feedback');let playing=false,score=0,level=1,lives=3,missedBamboo=0,grabbedJunk=0,best=Number(localStorage.getItem('grabbyBest')||0),items=[],last=0,spawnAt=0,face='normal',faceUntil=0,grabStarted=0,particles=[],catchFlash=null;const W=430,H=760,catchY=530,catchRadius=86;const catchTop=catchY-catchRadius,catchBottom=catchY+catchRadius;document.getElementById('best').textContent='BEST '+best;const junk=['🧱','🥾','🧦','🐟','💩','🪨','🍕','🧸'];const tintCanvas=document.createElement('canvas');tintCanvas.width=100;tintCanvas.height=100;const tintCtx=tintCanvas.getContext('2d');function greenChance(n){return n<20?0:n<40?.15:n<60?.30:n<80?.45:n<100?.60:.75}function drawObject(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(o.rot)*.15);ctx.font='65px system-ui';ctx.textAlign='center';if(o.greenDecoy){tintCtx.clearRect(0,0,100,100);tintCtx.font='65px system-ui';tintCtx.textAlign='center';tintCtx.fillText(o.emoji,50,68);tintCtx.globalCompositeOperation='source-atop';tintCtx.fillStyle='rgba(34,205,69,.78)';tintCtx.fillRect(0,0,100,100);tintCtx.globalCompositeOperation='source-over';ctx.drawImage(tintCanvas,-50,-50,100,100)}else{ctx.fillText(o.emoji,0,18)}ctx.restore()}function start(){score=0;level=1;lives=3;document.getElementById("levelFlash").classList.remove("show");missedBamboo=0;grabbedJunk=0;items=[];particles=[];catchFlash=null;last=performance.now();spawnAt=last+320;playing=true;overlay.style.display='none';update();requestAnimationFrame(loop)}function levelStart(n){return 5*(n-1)*n}function levelTarget(n){return n*10}function refreshLevel(){let completed=score-levelStart(level),needed=levelTarget(level);document.getElementById('leveltext').textContent='LEVEL '+level+' · '+completed+' / '+needed+' 🎋';document.getElementById('fill').style.width=(100*completed/needed)+'%'}function checkLevel(){if(score>=levelStart(level)+levelTarget(level)){level++;const el=document.getElementById('levelFlash');el.textContent='LEVEL '+level+'! 🎉';el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}refreshLevel()}function update(){refreshLevel();document.getElementById('score').textContent='🎋 '+score;document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);document.getElementById('best').textContent='BEST '+best}function say(s){feedback.textContent=s;setTimeout(()=>{if(feedback.textContent===s)feedback.textContent=''},650)}function lose(msg){if(msg==='MISSED BAMBOO!')missedBamboo++;else if(msg.startsWith('EW!'))grabbedJunk++;lives--;face='sad';faceUntil=performance.now()+650;say(msg);update();if(lives<=0){playing=false;let cause=missedBamboo>grabbedJunk?'🎋 BAMBOO NEGLECT':grabbedJunk>missedBamboo?'🧱 CHRONIC GREED':'🐼 MIXED DISASTER';overlay.innerHTML='<h1>GAME OVER! 🐼</h1><p style="font-size:26px">SCORE: <b>'+score+'</b><br>BEST: <b>'+best+'</b></p><p style="font-size:20px;font-weight:900;color:#ffdc80">CAUSE OF DEATH:<br>'+cause+'</p><p>The panda is disappointed in you.</p><button id="again">GRAB AGAIN!</button>';overlay.style.display='flex';document.getElementById('again').onclick=start}}function grab(){if(!playing)return;face='grab';grabStarted=performance.now();faceUntil=grabStarted+300;let eligible=items.filter(o=>o.y>=catchTop&&o.y<=catchBottom);/* Catch the lowest (earliest-arriving) object in the zone. */let target=eligible.sort((a,b)=>b.y-a.y)[0];if(target){catchFlash={x:target.x,y:target.y,good:target.good,until:performance.now()+260};items.splice(items.indexOf(target),1);if(target.good){score++;face='happy';faceUntil=performance.now()+400;say(['NOM! 🎋','CRUNCH!','YUM!'][score%3]);if(score>best){best=score;localStorage.setItem('grabbyBest',best)}checkLevel()}else lose('EW! '+target.emoji);update()}else{say('WHIFF!')}}function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.05);last=t;let speed=340+Math.min(660,score*21);if(t>=spawnAt){let good=Math.random()<.64;items.push({good,emoji:good?'🎋':junk[Math.floor(Math.random()*junk.length)],y:-50,x:215,rot:Math.random()*6,greenDecoy:!good&&Math.random()<greenChance(score)});/* Independent spawning: objects can overlap on screen, but keep a minimum reaction gap. */spawnAt=t+Math.max(235,570-score*10)}for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=speed*dt;o.rot+=dt*1.2;if(o.y>catchBottom){items.splice(i,1);if(o.good){lose('MISSED BAMBOO!');if(!playing)break}}}draw(t);if(playing)requestAnimationFrame(loop)}function draw(t){ctx.clearRect(0,0,W,H);for(let i=0;i<9;i++){let x=i*55-10;ctx.fillStyle='#4ea87b55';ctx.fillRect(x,0,13,590);ctx.fillStyle='#317a5888';for(let y=40;y<560;y+=110){ctx.beginPath();ctx.ellipse(x+21,y,26,7,-.6,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#6db356';ctx.fillRect(0,570,W,190);ctx.fillStyle='#8ed26c';ctx.beginPath();ctx.ellipse(215,570,300,40,0,0,Math.PI*2);ctx.fill();ctx.save();const pandaScale=Math.min(1.14,0.66+score*0.0048);ctx.translate(215,725);ctx.scale(pandaScale,pandaScale);ctx.translate(0,-75);ctx.fillStyle='#202a28';ctx.beginPath();ctx.ellipse(-83,75,48,28,-.4,0,7);ctx.ellipse(83,75,48,28,.4,0,7);ctx.fill();ctx.fillStyle='#fffdf3';ctx.beginPath();ctx.ellipse(0,20,112*(1+Math.min(.19,score*.0019)),105,0,0,7);ctx.fill();ctx.fillStyle='#202a28';ctx.beginPath();ctx.ellipse(-98,-15,35,48,-.6,0,7);ctx.ellipse(98,-15,35,48,.6,0,7);ctx.fill();ctx.fillStyle='#fffdf3';ctx.beginPath();ctx.arc(0,-89,94,0,7);ctx.fill();
let grabAge=t-grabStarted, reach=grabAge>=0&&grabAge<300?Math.sin(Math.PI*Math.min(1,grabAge/300)):0;
for(let side of [-1,1]){ctx.save();ctx.translate(side*(96-65*reach),-5-77*reach);ctx.rotate(side*(-.28-1.05*reach));ctx.fillStyle='#202a28';ctx.beginPath();ctx.ellipse(0,0,31,49,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#303b38';ctx.beginPath();ctx.ellipse(-side*5,-22,18,13,0,0,Math.PI*2);ctx.fill();ctx.restore()}
ctx.fillStyle='#202a28';for(let x of [-70,70]){ctx.beginPath();ctx.arc(x,-158,32,0,7);ctx.fill()}for(let x of [-37,37]){ctx.beginPath();ctx.ellipse(x,-99,27,36,x<0?-.35:.35,0,7);ctx.fill()}ctx.fillStyle='white';for(let x of [-37,37]){ctx.beginPath();ctx.arc(x,-99,10,0,7);ctx.fill()}ctx.fillStyle='#141b19';ctx.beginPath();ctx.ellipse(0,-59,15,10,0,0,7);ctx.fill();ctx.strokeStyle='#141b19';ctx.lineWidth=4;ctx.beginPath();if(face==='sad'&&t<faceUntil){ctx.arc(0,-29,14,Math.PI*1.15,Math.PI*1.85)}else if(face==='happy'&&t<faceUntil){ctx.arc(0,-55,23,0,Math.PI)}else{ctx.arc(0,-49,12,0,Math.PI)}ctx.stroke();ctx.restore();for(const item of items)drawObject(item);if(catchFlash&&t<catchFlash.until){ctx.save();ctx.strokeStyle=catchFlash.good?'#ffe66d':'#ff5964';ctx.lineWidth=7;ctx.globalAlpha=Math.max(0,(catchFlash.until-t)/260);ctx.beginPath();ctx.arc(catchFlash.x,catchFlash.y,44+(1-(catchFlash.until-t)/260)*24,0,Math.PI*2);ctx.stroke();ctx.restore()}ctx.fillStyle='rgba(130,255,160,.11)';ctx.fillRect(0,catchTop,W,catchBottom-catchTop);ctx.strokeStyle='rgba(255,255,255,.95)';ctx.setLineDash([10,7]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,catchTop);ctx.lineTo(W-12,catchTop);ctx.moveTo(12,catchBottom);ctx.lineTo(W-12,catchBottom);ctx.stroke();ctx.setLineDash([])}document.getElementById('start').onclick=start;c.addEventListener('pointerdown',e=>{e.preventDefault();grab()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();grab()}});draw(0);</script></body></html>
